name: Build iOS Sideload IPA

on:
  push:
    branches: ["main", "master"]
  pull_request:
  workflow_dispatch: 

permissions:
  contents: read
  actions: write

jobs:
  build-ios:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build app (unsigned)
        run: |
          xcodebuild \
            -project EncryptedIpaFetcher.xcodeproj \
            -scheme EncryptedIpaFetcher \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
            clean build

      - name: Package as IPA
        run: |
          APP_PATH=$(find ~/Library/Developer/Xcode/DerivedData -name EncryptedIpaFetcher.app -path "*Release-iphoneos*" | head -n 1)
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          zip -r EncryptedIpaFetcher-unsigned.ipa Payload

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: EncryptedIpaFetcher-unsigned-ipa
          path: EncryptedIpaFetcher-unsigned.ipa
